    <rect x="9.5"  y="2"    width="5.5" height="5.5"/>
    <rect x="9.5"  y="9.5"  width="5.5" height="5.5"/>
    <rect x="17"   y="9.5"  width="5.5" height="5.5"/>
    <rect x="17"   y="17"   width="5.5" height="5.5"/>
    <rect x="24.5" y="17"   width="5.5" height="5.5"/>
