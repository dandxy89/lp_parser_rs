name: Release VS Code extension

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. lp-lsp-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Server ${{ matrix.vsce }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vsce: linux-x64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { vsce: linux-arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { vsce: darwin-x64, target: x86_64-apple-darwin, runner: macos-latest }
          - { vsce: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { vsce: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { vsce: win32-arm64, target: aarch64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Set cross-compile env (macOS x86_64)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=clang" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }} -p lp-lsp
      # win32-arm64 is cross-compiled on x64 and cannot run here
      - name: Smoke test
        if: matrix.vsce != 'win32-arm64'
        shell: bash
        run: target/${{ matrix.target }}/release/lp-lsp${{ contains(matrix.target, 'windows') && '.exe' || '' }} --version
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.vsce }}
          path: target/${{ matrix.target }}/release/lp-lsp${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Marketplace trusted publishing
      contents: write # attach the VSIX files to the release
    defaults:
      run:
        working-directory: lsp/editors/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: ${{ github.workspace }}/servers
      - run: npm ci
      - name: Use the released changelog
        run: cp ../../CHANGELOG.md CHANGELOG.md
      - name: Package one VSIX per target
        run: |
          for dir in "$GITHUB_WORKSPACE"/servers/server-*; do
            target="${dir##*/server-}"
            rm -rf server && mkdir server && cp "$dir"/* server/ && chmod +x server/*
            npx vsce package --target "$target" --out "lp-lsp-$target.vsix"
            # one static musl build serves the Alpine targets too
            case "$target" in
              linux-x64)   npx vsce package --target alpine-x64   --out lp-lsp-alpine-x64.vsix ;;
              linux-arm64) npx vsce package --target alpine-arm64 --out lp-lsp-alpine-arm64.vsix ;;
            esac
          done
          # fallback for platforms with no specific package; relies on PATH or lp.server.path
          rm -rf server
          npx vsce package --out lp-lsp-universal.vsix
          ls -l *.vsix
      - name: Check the packages
        shell: bash
        run: |
          want="$(basename "${{ inputs.tag_name }}")"; want="${want##*-v}"
          for f in *.vsix; do
            unzip -p "$f" extension/package.json | grep -q "\"version\": \"$want\"" \
              || { echo "$f: version is not $want"; exit 1; }
            [ "$f" = lp-lsp-universal.vsix ] && continue
            unzip -l "$f" | grep -Eq 'extension/server/lp-lsp(\.exe)?$' \
              || { echo "$f: no bundled server"; exit 1; }
          done
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag_name }}" *.vsix --clobber
      # Publishing is opt-in per registry: set PUBLISH_VSCE / PUBLISH_OVSX to `true` once the
      # Marketplace publisher (trusted publishing) / Open VSX namespace exist.
      # One call: the OIDC token can be exchanged only once. --skip-duplicate makes re-runs safe.
      - name: Publish to the VS Code Marketplace
        if: ${{ vars.PUBLISH_VSCE == 'true' }}
        run: npx vsce publish --oidc --skip-duplicate --packagePath *.vsix
      - name: Publish to Open VSX
        if: ${{ vars.PUBLISH_OVSX == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: for f in *.vsix; do npx ovsx publish "$f" --skip-duplicate -p "$OVSX_PAT"; done
