name: vscode_build

on:
  pull_request:
    paths:
      - 'lsp/editors/vscode/**'
      - '.github/workflows/vscode_build.yml'
  push:
    branches: [main]
    paths:
      - 'lsp/editors/vscode/**'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lsp/editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --out /tmp/lp-lsp-check.vsix
