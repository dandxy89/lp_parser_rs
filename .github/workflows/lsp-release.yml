name: Build LSP Binaries

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. lp-lsp-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.tag_name }}"
          # Strip the component prefix (e.g. lp-lsp-v1.0.0 -> 0.2.0)
          VERSION="${VERSION##*-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set cross-compile env (macOS x86_64)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=clang" >> "$GITHUB_ENV"

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --package lp-lsp

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="lp-lsp-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/lp-lsp" "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          echo "ASSET=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${ARCHIVE_NAME}.tar.gz.sha256" >> "$GITHUB_ENV"

      # Optional: signs only when the Azure Trusted Signing secrets are configured;
      # unsigned builds are produced otherwise. Inputs follow azure/trusted-signing-action.
      - name: Sign binary (Windows)
        if: contains(matrix.target, 'windows') && env.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ArchiveName = "lp-lsp-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $ArchiveName -Force
          Copy-Item "target/${{ matrix.target }}/release/lp-lsp.exe" "$ArchiveName/"
          Compress-Archive -Path "$ArchiveName/*" -DestinationPath "$ArchiveName.zip"
          $hash = (Get-FileHash "$ArchiveName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $ArchiveName.zip" | Out-File -Encoding ascii "$ArchiveName.zip.sha256"
          echo "ASSET=$ArchiveName.zip" >> $env:GITHUB_ENV
          echo "CHECKSUM=$ArchiveName.zip.sha256" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lp-lsp-binary-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

  upload-release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lp-lsp-binary-*
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          cat *.sha256 > checksums-sha256.txt

      # `gh release upload` only adds assets. action-gh-release also updates
      # the release itself, which GitHub refuses on a manual run from a
      # commit newer than the tag ("Resource not accessible by integration").
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            *.tar.gz *.zip *.sha256 checksums-sha256.txt
