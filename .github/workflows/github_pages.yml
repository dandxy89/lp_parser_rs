name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "tui/assets/**", ".github/workflows/github_pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p docs/assets
          cp tui/assets/demo.gif docs/assets/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Ping IndexNow
        # best effort: a 4xx or 429 from IndexNow must not fail a deploy that has already succeeded
        continue-on-error: true
        # every page in the sitemap, so new pages are submitted without editing this step
        run: |
          grep -o '<loc>[^<]*</loc>' docs/sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' \
            | jq -R . | jq -s '{
                host: "dandxy89.github.io",
                key: "40f03b6cfc141f4ff79e06e0f2b09600",
                keyLocation: "https://dandxy89.github.io/lp_parser_rs/40f03b6cfc141f4ff79e06e0f2b09600.txt",
                urlList: .
              }' > indexnow.json
          cat indexnow.json
          curl -sS -f -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @indexnow.json
