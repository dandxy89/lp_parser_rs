name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "tui/assets/**", ".github/workflows/github_pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p docs/assets
          cp tui/assets/demo.gif docs/assets/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Ping IndexNow
        run: |
          curl -sS -f -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "dandxy89.github.io",
              "key": "40f03b6cfc141f4ff79e06e0f2b09600",
              "keyLocation": "https://dandxy89.github.io/lp_parser_rs/40f03b6cfc141f4ff79e06e0f2b09600.txt",
              "urlList": [
                "https://dandxy89.github.io/lp_parser_rs/",
                "https://dandxy89.github.io/lp_parser_rs/tui.html"
              ]
            }'
