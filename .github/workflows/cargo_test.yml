on:
  push:
    # Trigger on push events to the main branch and on changes to specific files
    branches:
      - "main"
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**.yml"
  pull_request:
    # Trigger on pull request events to the main branch and on changes to specific files
    types: [assigned, opened, synchronize, reopened]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**.yml"

name: Cargo Test

env:
  CARGO_TERM_COLOR: always # Ensure colored output in Cargo
  CI: true # Indicate that this is a CI environment
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # Group by workflow and branch
  cancel-in-progress: true # Cancel any in-progress runs for the same group

permissions:
  contents: read
  pull-requests: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      # Cache Rust dependencies to speed up builds
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # --all-features hides feature-gating mistakes: an item used under one
      # cfg but declared under another compiles fine once everything is on.
      # The `cli` binary declares `required-features = ["cli"]`, so that set
      # alone must build; `diff` and `csv` are the optional pair it forgets.
      - name: Clippy across feature combinations
        run: |
          for features in cli cli,diff cli,csv cli,diff,csv; do
            echo "::group::--features $features"
            cargo clippy --package lp_parser_rs --no-default-features \
              --features "$features" --all-targets -- -D warnings
            echo "::endgroup::"
          done
          echo "::group::library with no features"
          cargo clippy --package lp_parser_rs --no-default-features --lib -- -D warnings
          echo "::endgroup::"

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      # Check out the repository code
      - uses: actions/checkout@v7
      # Ensure Rust is installed and set up the active toolchain
      - name: Setup Rust
        run: rustup show active-toolchain || rustup toolchain install
      # Install CBC solver for lp-solvers integration tests
      - name: Install CBC solver
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc
      # Cache Rust dependencies to speed up builds
      - uses: Swatinem/rust-cache@v2
      # Run all tests with all features enabled (including CBC solver test via test-cbc feature)
      - name: Run tests
        run: cargo test --all-features
