[package]
name = "lp_parser_tui"
version = "3.6.0"
edition = "2024"
rust-version = "1.88.0"
description = "Interactive TUI model explorer and diff viewer for LP/MPS files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dandxy89/lp_parser_rs"
keywords = ["lp", "parser", "tui", "diff"]
categories = ["command-line-utilities"]

[[bin]]
name = "lp_diff"
path = "src/main.rs"

[dependencies]
lp_parser_rs = { path = "../rust", features = ["csv", "diff", "serde", "mmap"] }

arboard = "3.6.1"
chrono = "0.4.45"
csv = "1.4.0"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
frizbee = "0.11.0"
highs = "2.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
regex = "1.13.1"
tui-input = "0.15.3"

# Unix-only: raise(SIGTSTP) for Ctrl+Z suspend/resume. Already in the dependency
# tree transitively (crossterm); declared here so the call site is portable.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[lints]
workspace = true

[dev-dependencies]
insta = "1.48.0"
