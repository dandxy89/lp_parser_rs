[package]
name = "lp-lsp"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
description = "Language server for LP (linear programming) files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dandxy89/lp_parser_rs"
keywords = ["lp", "lsp", "language-server", "optimisation"]
categories = ["development-tools", "mathematics"]

[[bin]]
name = "lp-lsp"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/lp-lsp-v{ version }/lp-lsp-{ version }-{ target }{ archive-suffix }"
bin-dir = "lp-lsp-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true

[dependencies]
lp_parser_rs = { version = "5.0.2", path = "../rust", features = ["diff", "serde"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
tower-lsp-server = "0.23.0"
tree-sitter = "0.27.0"
tree-sitter-lp = "0.1"

[dev-dependencies]
criterion = "0.8.2"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
insta = "1.48.0"
proptest = "1.11.0"
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "lsp"
harness = false
