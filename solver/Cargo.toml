[package]
name = "lp-highs"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "HiGHS solver integration for LP/MPS models: solve, infeasibility diagnosis, IIS and ranging, plus a JSON helper protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dandxy89/lp_parser_rs"
readme = "README.md"
keywords = ["lp", "highs", "solver", "optimisation", "mps"]
categories = ["mathematics", "science"]

[lib]
name = "lp_highs"
path = "src/lib.rs"

[[bin]]
name = "lp-highs"
path = "src/main.rs"
required-features = ["highs"]

[[test]]
name = "cli"
required-features = ["highs"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/lp-highs-v{ version }/lp-highs-{ version }-{ target }{ archive-suffix }"
bin-dir = "lp-highs-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = ["highs"]
# The HiGHS bindings (built from source with cmake and a C++ compiler). Without
# it only the `protocol` module is built, so consumers that merely speak the
# helper protocol (the language server) pull in no C++ toolchain.
highs = ["dep:highs", "dep:highs-sys", "dep:lp_parser_rs"]

[dependencies]
lp_parser_rs = { path = "../rust", version = "5", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
highs = { version = "2.4.0", optional = true }
highs-sys = { version = "1.15.0", optional = true }

[lints]
workspace = true
